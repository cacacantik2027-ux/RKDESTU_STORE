<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1130"/>
      <stop offset="55%" stop-color="#7a0d0d"/>
      <stop offset="100%" stop-color="#2a0303"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffcf33"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#ffcf33"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- hazard stripes top & bottom -->
  <rect x="0" y="0" width="1080" height="26" fill="url(#stripe)"/>
  <rect x="0" y="1054" width="1080" height="26" fill="url(#stripe)"/>

  <!-- warning triangle -->
  <g transform="translate(540,300)">
    <polygon points="0,-140 150,120 -150,120" fill="none" stroke="#ffcf33" stroke-width="16" stroke-linejoin="round"/>
    <text x="0" y="80" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="#ffcf33" text-anchor="middle">!</text>
  </g>

  <text x="540" y="560" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">ANDA MENCURI</text>
  <text x="540" y="630" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">PROPERTI PRIBADI</text>
  <text x="540" y="700" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="#ffcf33" text-anchor="middle" letter-spacing="2">RKDESTU STORE</text>

  <text x="540" y="770" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#e6e6e6" text-anchor="middle">Foto asli TIDAK dapat diunduh dari website ini.</text>
  <text x="540" y="812" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#e6e6e6" text-anchor="middle">Setiap karya &amp; bukti transaksi dilindungi hak cipta.</text>

  <text x="540" y="900" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffcf33" text-anchor="middle" font-weight="700">Butuh file asli / kerjasama? Hubungi kami langsung:</text>
  <text x="540" y="944" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="900">t.me/gosahsoknal &#8226; RK DESTU STORE</text>
</svg>
